name: Feature Pipeline

on:
  schedule:
    - cron: "22 12 * * *"  # TEMP: testing that the schedule actually fires, revert to "7 12 * * *" after
  workflow_dispatch: {}

jobs:
  update-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Update weather features
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python -m feature_pipeline.daily_weather
      - name: Update price features
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python -m feature_pipeline.daily_prices
